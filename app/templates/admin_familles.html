{% extends "base.html" %}
{% block title %}Admin - Familles{% endblock %}
{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/admin" class="text-success">Admin</a></li>
        <li class="breadcrumb-item active">Familles</li>
    </ol>
</nav>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0"><i class="bi bi-diagram-3 text-success me-2"></i>Familles botaniques</h3>
    <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#addModal"><i class="bi bi-plus-lg"></i> Nouvelle famille</button>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <table class="table table-hover mb-0" style="font-size:0.85rem">
            <thead class="table-light"><tr><th>Nom</th><th>Description</th><th>Légumes</th><th style="width:100px">Actions</th></tr></thead>
            <tbody>
                {% for f in familles %}
                <tr>
                    <form method="post" action="/admin/familles/{{ f.id }}/editer">
                    <td><input type="text" class="form-control form-control-sm" name="nom" value="{{ f.nom }}" required></td>
                    <td><input type="text" class="form-control form-control-sm" name="description" value="{{ f.description }}"></td>
                    <td><span class="badge bg-success-subtle text-success-emphasis">{{ f.legumes|length }}</span></td>
                    <td class="text-nowrap">
                        <button type="submit" class="btn btn-sm btn-outline-success py-0 px-1"><i class="bi bi-check"></i></button>
                        <a href="/admin/familles/{{ f.id }}/supprimer" class="btn btn-sm btn-outline-danger py-0 px-1" onclick="return confirm('Supprimer {{ f.nom }} ?')"><i class="bi bi-trash"></i></a>
                    </td>
                    </form>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <form method="post" action="/admin/familles/creer">
            <div class="modal-header"><h5 class="modal-title">Nouvelle famille</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-2"><label class="form-label small fw-semibold">Nom</label><input type="text" class="form-control form-control-sm" name="nom" required></div>
                <div class="mb-2"><label class="form-label small fw-semibold">Description</label><textarea class="form-control form-control-sm" name="description" rows="3"></textarea></div>
            </div>
            <div class="modal-footer py-1">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="submit" class="btn btn-sm btn-success">Créer</button>
            </div>
        </form>
    </div></div>
</div>
{% endblock %}
