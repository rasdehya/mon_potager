<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mon Potager{% endblock %} - Guide de Culture</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-flower2 me-2"></i>Mon Potager
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-house-door me-1"></i>Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/legumes"><i class="bi bi-egg-fried me-1"></i>Légumes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/familles"><i class="bi bi-diagram-3 me-1"></i>Familles</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/potager"><i class="bi bi-journal-text me-1"></i>Mon Potager</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/settings"><i class="bi bi-gear me-1"></i>Réglages</a>
                    </li>
                </ul>
                <form class="d-flex" action="/recherche" method="get" role="search">
                    <div class="input-group input-group-sm">
                        <input class="form-control border-0" type="search" name="q" placeholder="Rechercher un légume..." aria-label="Rechercher">
                        <button class="btn btn-light" type="submit"><i class="bi bi-search"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <div id="chat-context" data-context="{% block page_context %}{% endblock %}" style="display:none"></div>

    <footer class="bg-light border-top mt-5 py-4">
        <div class="container text-center text-muted small">
            <i class="bi bi-flower2 me-1"></i> Mon Potager - Guide de Culture
            <span class="mx-2">|</span>
            Fait avec <i class="bi bi-heart-fill text-danger"></i> pour les jardiniers
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% include "chat_bubble.html" %}
</body>
</html>
